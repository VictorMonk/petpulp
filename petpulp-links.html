<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PetPulp — Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #FFF8F0;
      --card: #FFFFFF;
      --accent1: #FF6B2B;
      --accent2: #FFD166;
      --accent3: #06D6A0;
      --accent4: #118AB2;
      --accent5: #EF476F;
      --text: #1A1A2E;
      --muted: #7A7A90;
      --shadow: rgba(255,107,43,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      overflow-x: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: var(--accent1);
      top: -100px; left: -100px;
      animation: drift1 8s ease-in-out infinite alternate;
    }
    body::after {
      width: 350px; height: 350px;
      background: var(--accent2);
      bottom: -80px; right: -80px;
      animation: drift2 10s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(60px, 80px); } }
    @keyframes drift2 { to { transform: translate(-60px, -60px); } }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo area */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7) translateY(-20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--accent1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px var(--shadow), 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 4px solid #fff;
      position: relative;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Fallback emoji logo if img fails */
    .logo-fallback {
      font-size: 52px;
      line-height: 1;
    }

    .brand-name {
      font-family: 'Baloo 2', cursive;
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -1px;
      line-height: 1;
    }

    .brand-name span {
      color: var(--accent1);
    }

    .tagline {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: -4px;
    }

    /* Paw divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 24px;
      animation: fadeUp 0.5s 0.3s ease both;
    }
    .divider span { font-size: 1.2rem; }
    .divider-line {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2));
      border-radius: 2px;
    }
    .divider-line.right {
      background: linear-gradient(90deg, var(--accent2), transparent);
    }

    /* Link buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 17px 22px;
      border-radius: 20px;
      text-decoration: none;
      color: #fff;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 20px rgba(0,0,0,0.10);
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    .link-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .link-btn:hover::after { opacity: 1; }
    .link-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0,0,0,0.16);
    }
    .link-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .link-btn:nth-child(1) { background: linear-gradient(135deg, #010101 0%, #2b2b2b 100%); animation-delay: 0.3s; }
    .link-btn:nth-child(2) { background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%); animation-delay: 0.42s; }
    .link-btn:nth-child(3) { background: linear-gradient(135deg, #C13584 0%, #E1306C 50%, #F56040 100%); animation-delay: 0.54s; }
    .link-btn:nth-child(4) { background: linear-gradient(135deg, #1877F2 0%, #0a5fc4 100%); animation-delay: 0.66s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .link-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.18);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .link-label { flex: 1; }

    .link-arrow {
      opacity: 0.6;
      font-size: 1.1rem;
      transition: opacity 0.2s, transform 0.2s;
    }
    .link-btn:hover .link-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      text-align: center;
      animation: fadeUp 0.5s 0.8s ease both;
      opacity: 0;
    }
    .footer p {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }
    .footer .paws {
      font-size: 1.3rem;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

        <img src="your-logo-here.png" alt="PetPulp Logo"

  </div>
</body>
</html>
